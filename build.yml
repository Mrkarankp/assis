name: Build Brother Voice APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Find or repair the project folder
        id: find
        run: |
          echo "Files in repo:"
          find . -maxdepth 4 -not -path './.git/*' | head -60 || true
          f=$(find . -not -path './.git/*' -name settings.gradle.kts | head -1 || true)
          if [ -n "$f" ]; then
            d=$(dirname "$f")
          else
            a=$(find . -not -path './.git/*' -path '*/app/build.gradle.kts' | head -1 || true)
            if [ -z "$a" ]; then echo "ERROR: the app folder was not uploaded (app/build.gradle.kts not found)"; exit 1; fi
            d=$(dirname "$(dirname "$a")")
            echo "settings.gradle.kts was missing, creating it"
            cat > "$d/settings.gradle.kts" <<'EOS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BrotherVoice"
          include(":app")
          EOS
          fi
          if [ ! -f "$d/build.gradle.kts" ]; then
            echo "root build.gradle.kts was missing, creating it"
            cat > "$d/build.gradle.kts" <<'EOS'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOS
          fi
          rm -f "$d/app/debug.keystore"
          echo "Project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Restore signing key (same key on every build)
        uses: actions/cache@v4
        with:
          path: ${{ steps.find.outputs.dir }}/app/debug.keystore
          key: brother-keystore-v1
      - name: Create signing key if needed
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -keystore app/debug.keystore -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore app/debug.keystore -storepass android | head -5 || true
      - name: Bundle voice model into the APK
        continue-on-error: true
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -e
          mkdir -p tmpm app/src/main/assets
          curl -fL --retry 3 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip || curl -fL --retry 3 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip -d tmpm
          mv tmpm/* app/src/main/assets/model-in
      - name: Show project settings
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          ls
          grep -n "applicationId\|vosk\|abiFilters" app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug
      - name: Check and verify APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          f=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$f"
          unzip -l "$f" | grep -E "libvosk|libjnidispatch|model-in/am/final.mdl" | head -15 || true
          sz=$(stat -c%s "$f"); echo "APK bytes: $sz"
          test "$sz" -gt 3000000
          cp "$f" BrotherVoice.apk
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt=$(ls -d "$sdk"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          echo "build-tools: $bt"
          echo "---- SIGNATURE CHECK ----"
          "$bt/apksigner" verify --verbose --print-certs BrotherVoice.apk 2>&1 | head -12 || true
          echo "---- APK INFO ----"
          "$bt/aapt2" dump badging BrotherVoice.apk 2>&1 | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" | head -8 || true
      - uses: actions/upload-artifact@v4
        with:
          name: BrotherVoice-APK
          path: ${{ steps.find.outputs.dir }}/BrotherVoice.apk
